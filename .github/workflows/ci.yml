name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: sites/toolars

jobs:
  verify:
    name: Launch readiness
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      # Required so metadataBase / sitemap / JSON-LD resolve to an absolute URL
      # during the production build. No secrets needed for the build itself.
      NEXT_PUBLIC_SITE_URL: https://toolars.app
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sites/toolars/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Launch readiness
        run: pnpm run launch:readiness -- --full --base-url http://127.0.0.1:9188 --output ../../output/launch-readiness/ci

      - name: Upload launch readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-readiness
          path: output/launch-readiness/ci
          if-no-files-found: warn
